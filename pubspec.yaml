name: medi_yellocare
description: "Medi Y'ello Care."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  google_fonts: ^8.1.0
  flutter_spinkit: ^5.2.1
  qr_flutter: ^4.1.0
  font_awesome_flutter: ^10.7.0

  # State Management
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7

  # Navigation
  go_router: ^14.7.2

  # Scanner & Images
  mobile_scanner: ^6.0.4

  # Dependency Injection
  get_it: ^8.0.2

  # Firebase
  firebase_core: ^3.11.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.3
  firebase_storage: ^12.4.2

  # Utils
  uuid: ^4.5.1
  intl: ^0.19.0
  dartz: ^0.10.1 # Functional programming (Either)
  flutter_launcher_icons: ^0.14.4
  chat_bubbles: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icon/